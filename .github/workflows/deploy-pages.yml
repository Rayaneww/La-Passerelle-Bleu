# Publie le site (version statique) sur GitHub Pages à chaque push sur master.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Tests
        run: npx ng test --watch=false

      - name: Build statique (adresse de base = nom du dépôt)
        run: npx ng build --configuration production,github-pages --base-href "/${{ github.event.repository.name }}/"

      - name: Fichiers spécifiques à GitHub Pages
        run: |
          cp dist/frontend/browser/index.csr.html dist/frontend/browser/404.html
          touch dist/frontend/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
